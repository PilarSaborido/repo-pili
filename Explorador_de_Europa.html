<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Europa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff; /* sky-50 */
            touch-action: manipulation;
        }

        /* Map styling */
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .country {
            fill: #cbd5e1; /* slate-300 */
            stroke: #ffffff;
            stroke-width: 1px;
            transition: fill 0.3s ease, transform 0.2s ease;
            cursor: pointer;
            outline: none;
        }

        .country:hover {
            fill: #94a3b8; /* slate-400 */
        }

        /* Game states */
        .country.correct {
            fill: #4ade80 !important; /* green-400 */
            stroke: #166534;
            stroke-width: 2px;
        }

        .country.incorrect {
            fill: #f87171 !important; /* red-400 */
        }

        .country.disabled {
            pointer-events: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar for small screens */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- Loading Screen -->
    <div id="loading-screen" class="absolute inset-0 z-50 bg-sky-50 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600 mb-4"></div>
        <h2 class="text-2xl font-bold text-slate-700">Cargando Mapa de Europa...</h2>
    </div>

    <!-- Header & HUD -->
    <header class="bg-white shadow-md p-4 flex flex-col sm:flex-row justify-between items-center z-10">
        <div class="flex items-center gap-3 mb-3 sm:mb-0">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Geo<span class="text-blue-600">Europa</span></h1>
        </div>
        
        <div id="hud" class="hidden flex-col sm:flex-row items-center gap-4 sm:gap-8">
            <div class="text-center sm:text-left text-lg font-semibold text-slate-600">
                Pregunta: <span id="question-counter" class="text-blue-600 font-bold">1/10</span>
            </div>
            <div class="bg-blue-100 text-blue-800 px-4 py-2 rounded-full font-bold text-lg shadow-inner">
                Puntuación: <span id="score-display">0</span>
            </div>
            <button onclick="showMainMenu()" class="text-sm text-slate-500 hover:text-slate-700 underline">Salir</button>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow relative flex flex-col">
        
        <!-- Main Menu -->
        <div id="main-menu" class="absolute inset-0 z-40 bg-sky-50 flex flex-col items-center justify-center p-6 text-center">
            <h2 class="text-4xl font-extrabold mb-2 text-slate-800">¡Pon a prueba tu Geografía!</h2>
            <p class="text-lg text-slate-600 mb-8 max-w-md">Selecciona un modo de juego y haz clic en la ubicación correcta en el mapa para sumar puntos.</p>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="startGame('country')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-transform transform hover:scale-105">
                    Adivina el País
                </button>
                <button onclick="startGame('capital')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-transform transform hover:scale-105">
                    Adivina la Capital
                </button>
            </div>
        </div>

        <!-- Gameplay UI (Overlay) -->
        <div id="game-ui" class="hidden absolute top-4 left-0 right-0 z-20 flex justify-center pointer-events-none">
            <div class="bg-white/95 backdrop-blur-sm shadow-xl rounded-2xl p-4 sm:px-8 sm:py-4 text-center pointer-events-auto border-b-4 border-blue-500 fade-in">
                <p class="text-sm text-slate-500 font-semibold uppercase tracking-wider mb-1" id="prompt-prefix">Encuentra:</p>
                <h3 class="text-3xl sm:text-4xl font-extrabold text-slate-800" id="prompt-target">España</h3>
                <p id="feedback-msg" class="h-6 text-sm font-bold mt-2 opacity-0 transition-opacity"></p>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map-container" class="flex-grow w-full h-full relative cursor-crosshair bg-sky-100/50">
            <!-- D3 SVG will be injected here -->
        </div>

        <!-- Results Modal -->
        <div id="results-modal" class="hidden absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl scale-100 transition-transform fade-in">
                <h2 class="text-3xl font-extrabold mb-2" id="results-title">¡Juego Terminado!</h2>
                <p class="text-slate-600 mb-6">Has completado el desafío.</p>
                
                <div class="bg-blue-50 rounded-2xl p-6 mb-6">
                    <p class="text-sm text-slate-500 font-semibold mb-1">PUNTUACIÓN FINAL</p>
                    <p class="text-5xl font-extrabold text-blue-600"><span id="final-score">0</span> <span class="text-2xl text-slate-400">/ 10</span></p>
                </div>

                <button onclick="showMainMenu()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                    Volver al Menú
                </button>
            </div>
        </div>

    </main>

    <script>
        // Database of European Countries and Capitals
        const countriesData = [
            { name: "España", capital: "Madrid", geoNames: ["Spain"] },
            { name: "Francia", capital: "París", geoNames: ["France"] },
            { name: "Alemania", capital: "Berlín", geoNames: ["Germany"] },
            { name: "Italia", capital: "Roma", geoNames: ["Italy"] },
            { name: "Reino Unido", capital: "Londres", geoNames: ["United Kingdom", "England", "U.K.", "Great Britain"] },
            { name: "Portugal", capital: "Lisboa", geoNames: ["Portugal"] },
            { name: "Polonia", capital: "Varsovia", geoNames: ["Poland"] },
            { name: "Suecia", capital: "Estocolmo", geoNames: ["Sweden"] },
            { name: "Noruega", capital: "Oslo", geoNames: ["Norway"] },
            { name: "Finlandia", capital: "Helsinki", geoNames: ["Finland"] },
            { name: "Grecia", capital: "Atenas", geoNames: ["Greece"] },
            { name: "Ucrania", capital: "Kiev", geoNames: ["Ukraine"] },
            { name: "Suiza", capital: "Berna", geoNames: ["Switzerland"] },
            { name: "Países Bajos", capital: "Ámsterdam", geoNames: ["Netherlands"] },
            { name: "Irlanda", capital: "Dublín", geoNames: ["Ireland"] }
        ];

        // Global Variables
        let svg, projection, path, geoFeatures;
        let gameMode = 'country'; 
        let currentQueue = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isWaitingForNext = false;
        
        const maxQuestions = 10; // Play 10 questions per round

        // Initialize Map on Load
        window.onload = async () => {
            await initMap();
            document.getElementById('loading-screen').style.display = 'none';
        };

        async function initMap() {
            const width = 800;
            const height = 600;

            svg = d3.select("#map-container")
                .append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            // Projection centered on Europe
            projection = d3.geoMercator()
                .center([13, 53]) // Longitude, Latitude
                .scale(650)
                .translate([width / 2, height / 2]);

            path = d3.geoPath().projection(projection);

            try {
                // Fetch World GeoJSON Data
                const response = await fetch("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson");
                const data = await response.json();
                geoFeatures = data.features;

                // Draw map
                svg.append("g")
                    .selectAll("path")
                    .data(geoFeatures)
                    .enter()
                    .append("path")
                    .attr("d", path)
                    .attr("class", "country")
                    .attr("data-name", d => d.properties.name)
                    .on("click", handleCountryClick);

            } catch (error) {
                console.error("Error loading map data:", error);
                document.getElementById('loading-screen').innerHTML = "<h2 class='text-red-500 font-bold'>Error al cargar el mapa. Verifica tu conexión.</h2>";
            }
        }

        function startGame(mode) {
            gameMode = mode;
            score = 0;
            currentQuestionIndex = 0;
            isWaitingForNext = false;

            // Reset UI
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('results-modal').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').classList.add('flex');
            updateScore();

            // Clean map colors and enable clicks
            svg.selectAll(".country")
                .classed("correct", false)
                .classed("incorrect", false)
                .classed("disabled", false);

            // Generate question queue
            currentQueue = [...countriesData].sort(() => 0.5 - Math.random()).slice(0, maxQuestions);
            
            showNextQuestion();
        }

        function showNextQuestion() {
            if (currentQuestionIndex >= currentQueue.length) {
                endGame();
                return;
            }

            isWaitingForNext = false;
            const currentTarget = currentQueue[currentQuestionIndex];
            
            // Update UI text
            document.getElementById('question-counter').innerText = `${currentQuestionIndex + 1}/${maxQuestions}`;
            document.getElementById('prompt-prefix').innerText = gameMode === 'country' ? 'Encuentra el país:' : 'Encuentra la capital:';
            document.getElementById('prompt-target').innerText = gameMode === 'country' ? currentTarget.name : currentTarget.capital;
            
            // Reset feedback
            const feedbackMsg = document.getElementById('feedback-msg');
            feedbackMsg.style.opacity = '0';
            
            // Re-enable clicks
            svg.selectAll(".country").classed("disabled", false);
        }

        function handleCountryClick(event, d) {
            // Prevent double clicking during animation
            if (isWaitingForNext) return;
            
            const clickedName = d.properties.name;
            const currentTarget = currentQueue[currentQuestionIndex];
            
            // Check if clicked country name matches any of our known target geoNames
            const isCorrect = currentTarget.geoNames.includes(clickedName);
            
            isWaitingForNext = true;
            svg.selectAll(".country").classed("disabled", true); // Disable all clicks temporarily

            const clickedPath = d3.select(this);
            const feedbackMsg = document.getElementById('feedback-msg');

            if (isCorrect) {
                // Success
                score++;
                updateScore();
                clickedPath.classed("correct", true);
                
                feedbackMsg.innerText = "¡Correcto!";
                feedbackMsg.className = "h-6 text-sm font-bold mt-2 transition-opacity text-green-500";
                feedbackMsg.style.opacity = '1';

                setTimeout(() => {
                    clickedPath.classed("correct", false);
                    currentQuestionIndex++;
                    showNextQuestion();
                }, 1200);

            } else {
                // Incorrect
                clickedPath.classed("incorrect", true);
                
                feedbackMsg.innerText = `Incorrecto. Era ${currentTarget.name}.`;
                feedbackMsg.className = "h-6 text-sm font-bold mt-2 transition-opacity text-red-500";
                feedbackMsg.style.opacity = '1';

                // Find and briefly highlight the correct one
                const correctPath = svg.selectAll(".country").filter(function(d) {
                    return currentTarget.geoNames.includes(d.properties.name);
                });
                correctPath.classed("correct", true);

                setTimeout(() => {
                    clickedPath.classed("incorrect", false);
                    correctPath.classed("correct", false);
                    currentQuestionIndex++;
                    showNextQuestion();
                }, 2500);
            }
        }

        function updateScore() {
            document.getElementById('score-display').innerText = score;
        }

        function endGame() {
            document.getElementById('game-ui').classList.add('hidden');
            
            const resultsModal = document.getElementById('results-modal');
            const title = document.getElementById('results-title');
            
            document.getElementById('final-score').innerText = score;
            
            if(score === maxQuestions) {
                title.innerText = "¡Perfección!";
                title.className = "text-3xl font-extrabold mb-2 text-green-500";
            } else if (score >= maxQuestions / 2) {
                title.innerText = "¡Buen trabajo!";
                title.className = "text-3xl font-extrabold mb-2 text-blue-500";
            } else {
                title.innerText = "¡Sigue practicando!";
                title.className = "text-3xl font-extrabold mb-2 text-slate-800";
            }

            resultsModal.classList.remove('hidden');
        }

        function showMainMenu() {
            document.getElementById('results-modal').classList.add('hidden');
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('hud').classList.remove('flex');
            document.getElementById('main-menu').classList.remove('hidden');
            
            // Clean map
            svg.selectAll(".country")
                .classed("correct", false)
                .classed("incorrect", false)
                .classed("disabled", false);
        }
    </script>
</body>
</html>
